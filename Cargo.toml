# The public mirror of psi-syntax/ in JetBrains/accio, whose crates are members of accio's workspace and state their
# own package fields and lints; this manifest, Cargo.lock (accio's, pruned to these crates) and .gitignore are the
# mirror's own, every other file is accio's (accio's scripts/psi-syntax-mirror.sh).
[workspace]
resolver = "3"
members = ["crates/*"]

# psi-syntax's measurements (`scripts/{ab,pgo,gate}.sh`, `ksdump --bench`): fat LTO in one codegen unit with full
# debug info, accio's `psi` profile, the one every number of `docs/DESIGN.md` was taken on.
[profile.psi]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
