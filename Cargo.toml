[workspace]
resolver = "3"
members = ["crates/psi-builder", "crates/kotlin-syntax", "crates/java-syntax", "crates/csharp-syntax", "crates/ksdump"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/develar/psi-syntax"
publish = false

[workspace.dependencies]
psi-builder = { path = "crates/psi-builder" }
kotlin-syntax = { path = "crates/kotlin-syntax" }
java-syntax = { path = "crates/java-syntax" }
csharp-syntax = { path = "crates/csharp-syntax" }

[profile.release]
debug = true
codegen-units = 1
lto = "fat"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
