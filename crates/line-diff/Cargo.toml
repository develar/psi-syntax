[package]
name = "line-diff"
description = "Line, word and char comparison of two texts, ported from IntelliJ, and the lines a change moved, within a file and between the files of a change; Branch Deck's diff and the marks of diff-marks"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
# the code is ported from IntelliJ Platform, see NOTICE
license = "Apache-2.0"
repository = "https://github.com/JetBrains/accio"
publish = false

[dependencies]
fixedbitset = "0.5.7"
icu_properties = "2.4.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.11.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.145"

# Branch Deck's lints, which the code was written to and its `#[expect]`s name (decision
# 2026-11-13-diff-marks-in-psi-syntax): pedantic and nursery, the restriction lints that catch defects, the allows
# with their reasons.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
needless_raw_strings = "warn"
print_stderr = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
# the first paragraph of a doc comment is the whole description here, one or two sentences long
too_long_first_doc_paragraph = "allow"
# `if let … else` reads better than `map_or_else` with two closures
option_if_let_else = "allow"
# the opposite of rustc's `unreachable_pub`, which is on
redundant_pub_crate = "allow"
# a `for` over a hash map is wrong only when its order reaches the output; the results whose order shows are sorted
iter_over_hash_type = "allow"
# its suggestions break scoped blocks and guards; none of its findings was a contention
significant_drop_tightening = "allow"
# it flags comparisons of two different fields, which is what they are meant to be
suspicious_operation_groupings = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
implicit_hasher = "allow"
